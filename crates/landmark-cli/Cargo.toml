[package]
name = "landmark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for Landmark navigation mesh generation"
publish = false
keywords = ["cli", "landmark", "navmesh", "tool", "command-line"]
categories = ["command-line-utilities", "game-development"]

[[bin]]
name = "landmark-cli"
path = "src/main.rs"

[dependencies]
landmark-common = { workspace = true }
landmark = { workspace = true }
waymark = { workspace = true, features = ["serialization"] }
glam = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []

[lints]
workspace = true

---
name: Cross-Platform Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix-setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Generate build matrix for all supported platforms
        id: set-matrix
        run: |
          matrix=$(cat <<EOF
          {
            "include": [
              {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": true},
              {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true},
              {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": true},
              {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true},
              {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "cross": false},
              {"target": "aarch64-apple-darwin", "os": "macos-latest", "cross": false}
            ]
          }
          EOF
          )
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  cross-build:
    name: Build ${{ matrix.target }}
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BINARY_DEFAULT: ${{ vars.BINARY_DEFAULT || 'landmark-cli' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Rust toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Cache cross-compilation dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: "cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}"
          cache-on-failure: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross for cross-compilation
        if: matrix.cross
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2
        with:
          tool: cross

      - name: Build with cross for ${{ matrix.target }}
        if: matrix.cross
        run: |
          cross build --target "${{ matrix.target }}" --release --bin "${BINARY_DEFAULT}"

      - name: Build natively for ${{ matrix.target }}
        if: '!matrix.cross'
        shell: bash
        run: |
          cargo build --target "${{ matrix.target }}" --release --bin "${BINARY_DEFAULT}"

      - name: Verify build artifacts exist
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*)
              ls -la "target/${{ matrix.target }}/release/${BINARY_DEFAULT}.exe" || true
              ;;
            *)
              ls -la "target/${{ matrix.target }}/release/${BINARY_DEFAULT}" || true
              ;;
          esac

      - name: Upload cross-compilation artifacts for ${{ matrix.target }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: build-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.BINARY_DEFAULT }}*
          if-no-files-found: error
